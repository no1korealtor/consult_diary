<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>오늘 공부</title>

    <!-- PWA / 바로가기 아이콘 설정 -->
    <link rel="icon" type="image/png" href="study_icon.png">
    <link rel="apple-touch-icon" href="study_icon.png">
    <link rel="manifest" href="study_manifest.json">
    <meta name="theme-color" content="#ffc3a0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <!-- KaTeX 수학 수식 렌더링 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <link rel="stylesheet" href="style.css?v=20261124_02">

</head>

<body>

    <div class="header-container">
        <h1>🌸 오늘의 공부 &amp; 상식 퀴즈 🌸</h1>
        <div class="greeting" id="greeting-text">환영해요! 💖</div>
        <div class="date-stats" id="date-stats-text"></div>
    </div>

    <!-- 상단 대메뉴: [🧠 상식 퀴즈 (100원 적립)] vs [📋 생활·출결·과제 관리] -->
    <nav class="main-mode-nav">
        <button type="button" id="nav-btn-study" class="main-mode-btn active" onclick="switchMainTab('study')">
            <span>🧠</span> 상식 퀴즈 (1문제=100원!)
        </button>
        <button type="button" id="nav-btn-life" class="main-mode-btn" onclick="switchMainTab('life')">
            <span>📋</span> 생활·출결·과제 코칭
        </button>
    </nav>
    
    <div class="stats-bar" id="stats-bar">
        <div class="combo-badge hidden" id="combo-badge">🔥 0 Combo!</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
            <div class="progress-text" id="progress-text">오늘의 목표: 0 / 5</div>
        </div>
    </div>

    <div id="card-wrapper"></div>
    <div id="last-updated" class="last-updated"></div>
    
    <!-- 매일 출석 & 저녁 공부 체크 / 현황판 -->
    <div id="habit-container" class="habit-card hidden"></div>

    <div id="history-container" class="history-section hidden"></div>



    <script src="app.js?v=20261124_02" defer></script>



    <!-- 주요 일정 추가/관리 모달 -->
    <div class="modal-overlay hidden" id="schedule-modal-overlay" onclick="if(event.target === this) closeScheduleModal()">
        <div class="name-modal" style="max-width: 440px; width: 92%; padding: 22px; max-height: 88vh; overflow-y: auto; text-align: left;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px dashed #ffd1dc; padding-bottom:8px;">
                <h2 style="font-size:20px; color:#2d3436; margin:0; font-family:'Jua', sans-serif;">🗓️ 주요 일정 등록 & 관리</h2>
                <button type="button" onclick="closeScheduleModal()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#94a3b8;">✕</button>
            </div>

            <!-- 새 일정 등록 폼 -->
            <div style="background:#fff8f9; border:1.5px solid #ffe4e8; border-radius:16px; padding:14px; margin-bottom:16px;">
                <div style="font-family:'Jua', sans-serif; font-size:14px; color:#ff758c; margin-bottom:10px;">➕ 새로운 일정 등록</div>
                
                <label style="font-size:12px; font-weight:bold; color:#475569; display:block; margin-bottom:4px;">일정 제목</label>
                <input type="text" id="sched-input-title" class="habit-memo-input" style="padding:8px 12px; margin-bottom:10px;" placeholder="예: 2학기 중간고사, 할아버지 제사, 가족여행 등" maxlength="40">

                <label style="font-size:12px; font-weight:bold; color:#475569; display:block; margin-bottom:4px;">분류 / 이모지 선택</label>
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; margin-bottom:10px;" id="sched-category-selector">
                    <button type="button" class="habit-cal-btn sched-cat-btn active" data-icon="📝" data-cat="EXAM" onclick="selectSchedCat(this)">📝 중간/기말고사</button>
                    <button type="button" class="habit-cal-btn sched-cat-btn" data-icon="🕯️" data-cat="FAMILY" onclick="selectSchedCat(this)">🕯️ 제사/가족행사</button>
                    <button type="button" class="habit-cal-btn sched-cat-btn" data-icon="🎂" data-cat="BIRTHDAY" onclick="selectSchedCat(this)">🎂 생일/기념일</button>
                    <button type="button" class="habit-cal-btn sched-cat-btn" data-icon="🎒" data-cat="SCHOOL" onclick="selectSchedCat(this)">🎒 학교행사/소풍</button>
                    <button type="button" class="habit-cal-btn sched-cat-btn" data-icon="✈️" data-cat="VACATION" onclick="selectSchedCat(this)">✈️ 방학/여행/휴일</button>
                    <button type="button" class="habit-cal-btn sched-cat-btn" data-icon="📌" data-cat="OTHER" onclick="selectSchedCat(this)">📌 기타 일정</button>
                </div>

                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <div style="flex:1;">
                        <label style="font-size:12px; font-weight:bold; color:#475569; display:block; margin-bottom:4px;">시작일</label>
                        <input type="date" id="sched-input-start" class="habit-date-picker" style="width:100%; box-sizing:border-box; padding:6px 10px;" onchange="syncSchedEndDate(this.value)">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:12px; font-weight:bold; color:#475569; display:block; margin-bottom:4px;">종료일</label>
                        <input type="date" id="sched-input-end" class="habit-date-picker" style="width:100%; box-sizing:border-box; padding:6px 10px;">
                    </div>
                </div>

                <label style="font-size:12px; font-weight:bold; color:#475569; display:block; margin-bottom:4px;">메모 / 준비사항 (선택)</label>
                <input type="text" id="sched-input-memo" class="habit-memo-input" style="padding:8px 12px; margin-bottom:12px;" placeholder="예: 국어/수학 시험, 저녁 6시 큰집 등" maxlength="50">

                <button type="button" id="sched-save-btn" onclick="saveNewSchedule()" style="width:100%; background:linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color:white; border:none; padding:10px; border-radius:12px; font-weight:bold; font-family:'Jua', sans-serif; cursor:pointer; font-size:14px; box-shadow:0 3px 8px rgba(255, 117, 140, 0.3);">
                    💾 일정 추가하기 💖
                </button>
            </div>

            <!-- 등록된 일정 목록 -->
            <div>
                <div style="font-family:'Jua', sans-serif; font-size:14px; color:#475569; margin-bottom:8px;">📋 등록된 전체 일정 목록</div>
                <div id="sched-modal-list" style="display:flex; flex-direction:column; gap:6px; max-height:200px; overflow-y:auto;">
                    <!-- JS renders list here -->
                </div>
            </div>
        </div>
    </div>


                <footer class="site-footer">
        <div class="site-footer-inner">
            <div class="footer-links">
                <a href="#">회사소개</a>
                <a href="#" style="color: #fca5a5;">개인정보처리방침</a>
                <a href="#">이용약관</a>
            </div>
            <div class="footer-info">
                <strong class="footer-strong">신대림공인중개사사무소 (제호: 공인중개사소식지)</strong>
                <span>대표/발행·편집인: 조항준</span> <span>등록번호: 서울, 아53763</span> <span>등록일자: 2021년 06월 14일</span><br>
                <span>사업자등록번호: 219-01-50737</span> <span>전화번호: 02-375-4489</span> <span>주소: 서울특별시 마포구 모래내로7길 52 (성산동)</span>
            </div>
        </div>
    </footer>
</body>

</html>
