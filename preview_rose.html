<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성모송 생화 장미 봉헌 연출 시안 (A/B 비교)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090D1A;
    color: #F8FAFC;
    font-family: 'Noto Serif KR', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .preview-header {
    text-align: center;
    max-width: 500px;
    margin-bottom: 20px;
  }
  .preview-header h1 {
    font-size: 1.25rem;
    color: #FDE68A;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .preview-header p {
    font-size: 0.85rem;
    color: #94A3B8;
    line-height: 1.45;
  }
  .toggle-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    background: rgba(255,255,255,0.06);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .toggle-btn {
    padding: 8px 18px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: #94A3B8;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle-btn.active {
    background: linear-gradient(135deg, #F59E0B, #B45309);
    color: #FFF;
    box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
  }

  /* Phone Mockup Frame */
  .phone-frame {
    width: 100%;
    max-width: 360px;
    height: 640px;
    background: radial-gradient(circle at 50% 25%, #18233C 0%, #0F172A 70%, #090D1A 100%);
    border-radius: 36px;
    border: 3px solid rgba(243, 198, 105, 0.35);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(243, 198, 105, 0.15);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .mock-header {
    padding: 16px 20px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .mock-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #FDE68A;
  }
  .mock-sub {
    font-size: 0.72rem;
    color: #94A3B8;
    margin-top: 2px;
  }

  /* Prayer Card Area */
  .mock-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    position: relative;
  }
  .prayer-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(243, 198, 105, 0.2);
    border-radius: 20px;
    padding: 24px 18px;
    width: 100%;
    backdrop-filter: blur(8px);
  }
  .prayer-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: #FFF;
    margin-bottom: 8px;
  }
  .prayer-text {
    font-size: 0.88rem;
    line-height: 1.7;
    color: rgba(241, 245, 249, 0.85);
  }

  /* Trigger Button */
  .trigger-bar {
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .cta-btn {
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: #FFF;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* Rose Bloom Animations */
  .bloom-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bloom-burst {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: burstAscend 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Gold Celestial Glow */
  .bloom-glow {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.55) 0%, rgba(217, 119, 6, 0.2) 55%, transparent 75%);
    filter: blur(14px);
    animation: glowPulse 2.5s ease-out forwards;
  }

  .bloom-ring {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid rgba(253, 230, 138, 0.9);
    animation: ringExpand 1.6s cubic-bezier(0.12, 0.8, 0.32, 1) forwards;
  }

  /* Real Rose Token */
  .real-rose-token {
    position: relative;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, rgba(253, 230, 138, 0.9) 0%, rgba(245, 158, 11, 0.7) 50%, rgba(180, 83, 9, 0.9) 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 25px rgba(245, 158, 11, 0.6);
    animation: roseAscend 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .real-rose-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    filter: contrast(1.08) brightness(1.04);
  }

  .real-rose-inner-halo {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    box-shadow: inset 0 0 16px rgba(245, 158, 11, 0.45);
    pointer-events: none;
  }

  /* Vector Rose */
  .vector-rose-token {
    width: 110px;
    height: 110px;
    animation: roseAscend 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Title Badge */
  .bloom-badge {
    position: absolute;
    bottom: -15px;
    white-space: nowrap;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(243, 198, 105, 0.65);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #FDE68A;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    animation: badgeFloat 2.5s ease-out forwards;
  }

  @keyframes roseAscend {
    0% {
      transform: scale(0.3) rotate(-12deg);
      opacity: 0;
    }
    22% {
      transform: scale(1.08) rotate(3deg);
      opacity: 1;
    }
    36% {
      transform: scale(1.0) rotate(0deg);
      opacity: 1;
    }
    68% {
      transform: scale(1.03) translateY(-18px);
      opacity: 0.95;
    }
    100% {
      transform: scale(1.15) translateY(-60px);
      opacity: 0;
    }
  }

  @keyframes ringExpand {
    0% { transform: scale(0.4); opacity: 1; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  @keyframes glowPulse {
    0% { transform: scale(0.4); opacity: 0; }
    30% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  @keyframes badgeFloat {
    0% { transform: translateY(12px); opacity: 0; }
    25% { transform: translateY(0); opacity: 1; }
    70% { transform: translateY(-12px); opacity: 0.95; }
    100% { transform: translateY(-40px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="preview-header">
  <h1>🌹 성모송 장미 꽃피움 연출 비교 시안</h1>
  <p>성모송을 바칠 때 성모님께 드리는 장미 한 송이가 천상으로 피어오르는 연출입니다.<br>아래 버튼을 눌러 연출을 직접 체험해 보세요.</p>
</div>

<div class="toggle-controls">
  <button id="btnModeReal" class="toggle-btn active" onclick="setMode('real')">✨ 사용자님 생화 장미 (추천)</button>
  <button id="btnModeVector" class="toggle-btn" onclick="setMode('vector')">🎨 기존 그래픽 장미</button>
</div>

<!-- Phone Mockup Frame -->
<div class="phone-frame">
  <div class="mock-header">
    <div class="mock-title">환희의 신비 1단</div>
    <div class="mock-sub">성모송 10번 중 3번째 알</div>
  </div>

  <div class="mock-body">
    <div class="prayer-card">
      <div class="prayer-name">성모송 (Ave Maria)</div>
      <div class="prayer-text">
        은총이 가득하신 마리아님, 기뻐하소서!<br>
        주님께서 함께 계시니 여인 중에 복되시며,<br>
        태중의 아들 예수님 또한 복되시나이다.<br>
        천주의 성모 마리아님,<br>
        이제와 저희 죽을 때에<br>
        저희 죄인을 위하여 빌어주소서.<br>
        아멘.
      </div>
    </div>

    <!-- Rose Bloom Burst Area -->
    <div class="bloom-container" id="bloomContainer"></div>
  </div>

  <div class="trigger-bar">
    <button class="cta-btn" onclick="playBloom()">
      <span>🌹</span> <span>성모송 다음 알로 이동 (연출 보기)</span>
    </button>
  </div>
</div>

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnModeReal').classList.toggle('active', mode === 'real');
    document.getElementById('btnModeVector').classList.toggle('active', mode === 'vector');
    playBloom();
  }

  function playBloom() {
    const container = document.getElementById('bloomContainer');
    container.innerHTML = '';

    const burst = document.createElement('div');
    burst.className = 'bloom-burst';

    let tokenHtml = '';
    if (currentMode === 'real') {
      tokenHtml = `
        <div class="real-rose-token">
          <img src="${roseDataUri}" class="real-rose-img" alt="성모송 생화 장미" />
          <div class="real-rose-inner-halo"></div>
        </div>
      `;
    } else {
      tokenHtml = `
        <svg class="vector-rose-token" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="#FFE4E8" stroke="#F48FB1" stroke-width="2"/>
          <path d="M 50 20 C 30 20, 20 40, 50 60 C 80 40, 70 20, 50 20 Z" fill="#E91E63"/>
          <circle cx="50" cy="50" r="18" fill="#F06292"/>
        </svg>
      `;
    }

    burst.innerHTML = `
      <div class="bloom-glow"></div>
      <div class="bloom-ring"></div>
      ${tokenHtml}
      <div class="bloom-badge">🌹 제1단 · 제 3 송이 장미 봉헌</div>
    `;

    container.appendChild(burst);
    setTimeout(() => {
      if (burst.parentNode) burst.parentNode.removeChild(burst);
    }, 2600);
  }

  window.addEventListener('load', () => {
    setTimeout(playBloom, 400);
  });
</script>
